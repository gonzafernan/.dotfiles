name: check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  eval:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        host: [personal, work]
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      # Evaluate only: catches config errors without downloading or building packages.
      - run: >
          nix eval --raw --option allow-import-from-derivation false
          .#homeConfigurations.${{ matrix.host }}.activationPackage.drvPath
