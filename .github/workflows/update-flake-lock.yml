name: update-flake-lock

on:
  schedule:
    # Cron has no "every other week"; the 1st and 15th are close enough.
    - cron: "0 6 1,15 * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - run: nix flake update
      # PRs opened with GITHUB_TOKEN don't trigger check.yml, so evaluate here.
      - run: |
          for host in personal work; do
            nix eval --raw --option allow-import-from-derivation false \
              ".#homeConfigurations.$host.activationPackage.drvPath"
          done
      - uses: peter-evans/create-pull-request@v7
        with:
          branch: chore/update-flake-lock
          commit-message: "chore: update flake.lock"
          title: "chore: update flake.lock"
          body: Scheduled `nix flake update`; both hosts evaluate.
